<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civil Rights Movement Timeline 1954–1970</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111;--card:#1e1e1e;--red:#c0392b;--red-dim:#7b241c;
  --gold:#b8960c;--white:#f0ece4;--muted:#777770;
  --card-w:220px;--img-h:145px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:"Oswald",sans-serif;overflow-x:hidden}

/* HERO */
.hero{height:100vh;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;background:#080808;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.012) 3px,rgba(255,255,255,.012) 4px);pointer-events:none}
.hero-tag{font-size:.75rem;letter-spacing:.4em;text-transform:uppercase;color:var(--red);margin-bottom:1.4rem}
.hero h1{font-size:clamp(3.5rem,11vw,9rem);font-weight:700;line-height:.88;text-transform:uppercase;letter-spacing:-.02em;margin-bottom:1.4rem}
.hero h1 em{color:var(--red);font-style:normal}
.hero-dates{font-size:clamp(1rem,2vw,1.4rem);font-weight:300;letter-spacing:.25em;color:var(--muted);margin-bottom:3.5rem}
.arrow-down{display:flex;flex-direction:column;align-items:center;gap:.4rem;color:var(--muted);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;animation:bob 2.2s ease-in-out infinite}
.arrow-down svg{width:22px;height:22px;stroke:var(--red);fill:none;stroke-width:2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

/* NAV */
.nav-bar{position:sticky;top:0;z-index:200;background:rgba(8,8,8,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--red-dim);display:flex;align-items:center;gap:1.2rem;padding:.55rem 2rem;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.nav-bar b{color:var(--red);font-weight:500}
.nav-bar svg{width:15px;height:15px;stroke:var(--red);fill:none;stroke-width:2;flex-shrink:0}
.era-pills{display:flex;gap:.5rem;margin-left:auto;flex-wrap:wrap}
.era-pill{font-size:.6rem;letter-spacing:.12em;padding:.2rem .6rem;border:1px solid #333;color:var(--muted);text-transform:uppercase;cursor:pointer;transition:border-color .15s,color .15s;background:none;font-family:"Oswald",sans-serif}
.era-pill:hover{border-color:var(--red);color:var(--white)}

/* TIMELINE */
.tl-outer{padding:4rem 0 8rem}
.tl-scroll{overflow-x:auto;overflow-y:visible;padding:0 6vw;cursor:grab;scrollbar-width:thin;scrollbar-color:var(--red-dim) #1a1a1a}
.tl-scroll:active{cursor:grabbing}
.tl-scroll::-webkit-scrollbar{height:3px}
.tl-scroll::-webkit-scrollbar-thumb{background:var(--red-dim)}
.tl-inner{position:relative}

/* SPINE — absolutely centered between top and bottom */
.spine-track{position:absolute;left:0;right:0;pointer-events:none;z-index:1}
.spine-line{position:absolute;left:0;height:5px;top:50%;transform:translateY(-50%);background:linear-gradient(90deg,transparent,var(--red) 1%,var(--red) 99%,transparent)}

/* YEAR NODES — centered on spine, label ABOVE dot */
.year-node{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:4;transform:translate(-50%,-100%);padding-bottom:11px}
/* dot is last child so it sits at the bottom of the node, touching the spine */
.year-node-inner{display:flex;flex-direction:column;align-items:center;gap:.28rem}
.year-dot{width:22px;height:22px;border-radius:50%;background:var(--red);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--red),0 0 14px rgba(192,57,43,.5);flex-shrink:0}
.year-num{font-size:1.55rem;font-weight:700;letter-spacing:.04em;white-space:nowrap;color:var(--white);line-height:1}

/* CARDS */
.card{position:absolute;width:var(--card-w);background:var(--card);border:1px solid #2a2a2a;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;z-index:3}
.card.is-top{border-top:3px solid var(--red)}
.card.is-bottom{border-bottom:3px solid var(--red)}
.card.is-top:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(192,57,43,.28);z-index:10}
.card.is-bottom:hover{transform:translateY(3px);box-shadow:0 10px 36px rgba(192,57,43,.28);z-index:10}
.card.profile.is-top{border-top-color:var(--gold)}
.card.profile.is-bottom{border-bottom-color:var(--gold)}
.card.profile:hover{box-shadow:0 10px 36px rgba(184,150,12,.25)!important}
.card.signpost.is-top{border-top-color:#3a3a3a;background:#181818}
.card.signpost.is-bottom{border-bottom-color:#3a3a3a;background:#181818}
.card.signpost:hover{box-shadow:0 6px 20px rgba(255,255,255,.06)!important}

.card img{width:100%;height:var(--img-h);object-fit:cover;display:block;filter:grayscale(100%) contrast(1.08);transition:filter .3s}
.card:hover img{filter:grayscale(50%) contrast(1.12)}
.card-placeholder{width:100%;height:var(--img-h);display:flex;align-items:center;justify-content:center;background:#161616}
.card-placeholder span{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:#444}
.card-body{padding:.6rem .75rem .75rem}
.card-yr{font-size:.6rem;letter-spacing:.22em;color:var(--red);text-transform:uppercase;margin-bottom:.15rem}
.card-title{font-size:.83rem;font-weight:600;text-transform:uppercase;letter-spacing:.025em;line-height:1.25;color:var(--white);margin-bottom:.25rem}
.card-short{font-size:.69rem;font-weight:300;color:#999;line-height:1.45}

.profile-badge{display:inline-flex;align-items:center;gap:.3rem;background:var(--gold);color:#000;font-size:.55rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:.18rem .45rem;margin-bottom:.3rem}
.card-role{font-size:.67rem;font-weight:300;color:var(--gold);margin-bottom:.25rem;line-height:1.3}

.sp-item{padding:.42rem 0;border-bottom:1px solid #252525}
.sp-item:last-child{border-bottom:none}
.sp-title{font-size:.77rem;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:var(--white);margin-bottom:.18rem}
.sp-desc{font-size:.66rem;font-weight:300;color:#888;line-height:1.42}

.combo-divider{border:none;border-top:1px solid #2a2a2a;margin:.45rem 0 .38rem}
.combo-item{padding:.28rem 0;border-bottom:1px solid #222}
.combo-item:last-child{border-bottom:none}
.combo-item-title{font-size:.71rem;font-weight:600;text-transform:uppercase;color:#bbb;margin-bottom:.1rem}
.combo-item-desc{font-size:.64rem;font-weight:300;color:#777;line-height:1.38}

.combined-divider{border:none;border-top:2px solid #252525;margin:0}
.combined-profile{padding:.52rem .75rem .68rem;background:#171717}
.combined-label{display:inline-flex;align-items:center;gap:.3rem;background:var(--gold);color:#000;font-size:.52rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:.15rem .4rem;margin-bottom:.22rem}
.combined-name{font-size:.8rem;font-weight:600;text-transform:uppercase;color:var(--white);margin-bottom:.1rem}
.combined-role{font-size:.64rem;color:var(--gold);font-weight:300;margin-bottom:.2rem}
.combined-bio{font-size:.66rem;font-weight:300;color:#888;line-height:1.42}

/* SVG connectors */
.conn-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:2}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;align-items:center;justify-content:center;padding:2rem}
.modal.open{display:flex}
.modal-box{background:#1a1a1a;border:1px solid #2d2d2d;border-top:3px solid var(--red);max-width:640px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-img{width:100%;max-height:320px;object-fit:cover;display:block;filter:grayscale(100%)}
.modal-body{padding:1.5rem 2rem 2rem}
.modal-yr{color:var(--red);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.4rem}
.modal-title{font-size:1.55rem;font-weight:700;text-transform:uppercase;line-height:1.05;margin-bottom:.9rem}
.modal-text{font-size:.88rem;font-weight:300;line-height:1.75;color:#c8c4bc}
.modal-extra{margin-top:1rem}
.modal-section{margin-top:1rem;padding-top:1rem;border-top:1px solid #2a2a2a}
.modal-section-lbl{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.45rem}
.modal-close{position:absolute;top:.9rem;right:1.1rem;background:none;border:none;color:#555;font-size:1.6rem;cursor:pointer;line-height:1;font-family:"Oswald",sans-serif;transition:color .15s}
.modal-close:hover{color:var(--white)}

.footer{text-align:center;padding:2.5rem 2rem;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:#444;border-top:1px solid #1d1d1d}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.hero-tag,.hero h1,.hero-dates,.arrow-down{animation:up .8s ease both}
.hero-tag{animation-delay:.1s}.hero h1{animation-delay:.25s}.hero-dates{animation-delay:.4s}.arrow-down{animation-delay:.6s}
</style>
</head>

<section class="hero">
  <div class="hero-tag">American History &middot; 11th Grade</div>
  <h1>The Civil<br><em>Rights</em><br>Movement</h1>
  <div class="hero-dates">1954 &mdash; 1970</div>
  <div class="arrow-down">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7-7 7"/></svg>

</div>

<section class="tl-outer">
  <div class="tl-scroll" id="tlScroll">

<div class="modal" id="modal">

      <div class="modal-text" id="mText"></div>
      <div class="modal-extra" id="mExtra"></div>
    </div>
  </div>
</div>

istory with just eight weeks preparation. A lifelong pacifist who introduced King to Gandhian nonviolence, Rustin was kept out of the spotlight because he was openly gay, a calculated sacrifice by movement leaders. He was not awarded the Presidential Medal of Freedom until 2013, nearly 30 years after his death."}, {"year": "1964", "pos": "bottom", "type": "signpost", "img": "", "items": [{"title": "LBJ Wins Reelection", "desc": "Johnson wins in a historic landslide over Barry Goldwater, carrying 44 states and 61 percent of the popular vote, enabling the Great Society agenda."}]}, {"year": "1959", "pos": "bottom", "type": "signpost", "img": "", "items": [{"title": "Presidential Election of 1960", "desc": "John F. Kennedy narrowly defeats Richard Nixon, in part by making a highly publicized phone call to Coretta Scott King while MLK was jailed in Georgia. Black voter turnout surges and proves decisive in key states. Kennedy's election raises hopes for federal action on civil rights."}]}, {"year": "1958", "pos": "bottom", "type": "profile", "img": "ralph_abernathy", "name": "Ralph Abernathy", "role": "SCLC Co-Founder, MLK's Closest Ally", "short": "The man who stood beside King at every march, every jail cell, and every moment of crisis.", "bio": "Ralph Abernathy co-founded the SCLC with Martin Luther King Jr. and was his closest friend and most trusted lieutenant. He organized the Montgomery Bus Boycott alongside King, was jailed with him in Birmingham, and stood on the balcony of the Lorraine Motel the day King was shot. After King's assassination, Abernathy led the SCLC and the Poor People's Campaign. He is often overlooked in popular memory despite being King's indispensable partner for fifteen years."}];

const ALL_YEARS = ["1954", "1955", "1956", "1957", "1958", "1959", "1960", "1961", "1962", "1963", "1964", "1965", "1966", "1967", "1968", "1969", "1970"];

// ── LAYOUT CONSTANTS ──────────────────────────────────────────────────────
const YEAR_GAP  = 40;   // gap between year groups
const CARD_W    = 220;  // must match CSS --card-w
const CARD_GAP  = 10;   // gap between cards in same year
const TOP_H     = 380;  // pixels above spine center
const BOT_H     = 350;  // pixels below spine center
const SPINE_CY  = TOP_H; // Y of spine center line
const SPINE_H   = 70;   // visual height of spine strip
const PAD_L     = 80;   // left padding

// ── LAYOUT ENGINE ─────────────────────────────────────────────────────────
// For each year, compute:
//   - yearX: center X of the year group
//   - cards[]: {ev, x, y, w, h, isTop}
// Cards in same year are placed side by side, centered on yearX
// Top cards: bottom edge = SPINE_CY - 24 (stem gap)
// Bottom cards: top edge = SPINE_CY + 24

function computeLayout() {
  const layout = []; // {year, yearX, dotX, topCards:[], botCards:[]}
  let curX = PAD_L;

  ALL_YEARS.forEach(year => {
    const topEvs = EVENTS.filter(e => e.year === year && e.pos === 'top');
    const botEvs = EVENTS.filter(e => e.year === year && e.pos === 'bottom');
    const maxCards = Math.max(topEvs.length, botEvs.length, 1);
    const groupW = maxCards * CARD_W + (maxCards - 1) * CARD_GAP;
    const yearX = curX + groupW / 2;

    // Stagger: alternate each year group slightly to avoid adjacent overlap
    // top cards: alternate left/right of yearX for multi-card years
    const topCards = topEvs.map((ev, i) => {
      const totalW = topEvs.length * CARD_W + (topEvs.length - 1) * CARD_GAP;
      const startX = yearX - totalW / 2;
      const cx = startX + i * (CARD_W + CARD_GAP) + CARD_W / 2;
      return { ev, cx, isTop: true };
    });
    const botCards = botEvs.map((ev, i) => {
      const totalW = botEvs.length * CARD_W + (botEvs.length - 1) * CARD_GAP;
      const startX = yearX - totalW / 2;
      const cx = startX + i * (CARD_W + CARD_GAP) + CARD_W / 2;
      return { ev, cx, isTop: false };
    });

    layout.push({ year, yearX, groupW, topCards, botCards });
    curX += groupW + YEAR_GAP;
  });

  return { layout, totalW: curX + PAD_L };
}

function dispYear(y) {
  return String(y).replace(/[abc]/g, '').replace(/\.\d+$/, '');
}

function build() {
  const inner = document.getElementById('tlInner');
  const { layout, totalW } = computeLayout();
  const totalH = TOP_H + SPINE_H / 2 + BOT_H;

  inner.style.width  = totalW + 'px';
  inner.style.height = totalH + 'px';
  inner.style.position = 'relative';

  // ── SVG layer
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.className = 'conn-svg';
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  inner.appendChild(svg);

  // ── Spine track
  const spineTrack = document.createElement('div');
  spineTrack.className = 'spine-track';
  spineTrack.style.cssText = `top:${SPINE_CY - SPINE_H/2}px; height:${SPINE_H}px; width:${totalW}px;`;
  const spineLine = document.createElement('div');
  spineLine.className = 'spine-line';
  spineLine.style.width = totalW + 'px';
  spineTrack.appendChild(spineLine);
  inner.appendChild(spineTrack);

  // ── Year nodes and cards
  layout.forEach(({ year, yearX, topCards, botCards }) => {
    // Year node — centered on spine, label above dot
    const node = document.createElement('div');
    node.className = 'year-node';
    node.dataset.year = year;
    node.style.left = yearX + 'px';
    node.style.top  = SPINE_CY + 'px'; // dot bottom sits on spine line; CSS transform pulls up
    // transform is handled by CSS: translate(-50%, -100%) with padding-bottom for dot

    const inner2 = document.createElement('div');
    inner2.className = 'year-node-inner';

    const dot = document.createElement('div');
    dot.className = 'year-dot';

    const lbl = document.createElement('div');
    lbl.className = 'year-num';
    lbl.textContent = dispYear(year);

    inner2.appendChild(dot);
    inner2.appendChild(lbl);
    node.appendChild(inner2);
    inner.appendChild(node);

    // ── Place cards and draw connectors
    const STEM = 22; // px from spine center to card edge

    topCards.forEach(({ ev, cx }) => {
      const card = buildCard(ev, true);
      card.style.left = (cx - CARD_W / 2) + 'px';
      // bottom of card = SPINE_CY - STEM
      // We set after render; use placeholder
      card.dataset.cx = cx;
      card.dataset.isTop = '1';
      card.dataset.spineCy = SPINE_CY;
      card.dataset.stem = STEM;
      inner.appendChild(card);

      // Connector: from spine center (yearX, SPINE_CY) to card bottom center (cx, SPINE_CY - STEM)
      addConnector(svg, yearX, SPINE_CY, cx, SPINE_CY - STEM, true, ev.type);
    });

    botCards.forEach(({ ev, cx }) => {
      const card = buildCard(ev, false);
      card.style.left = (cx - CARD_W / 2) + 'px';
      card.style.top  = (SPINE_CY + STEM) + 'px';
      card.dataset.cx = cx;
      card.dataset.isTop = '0';
      inner.appendChild(card);

      addConnector(svg, yearX, SPINE_CY, cx, SPINE_CY + STEM, false, ev.type);
    });
  });

  // Fix top card positions using actual heights
  requestAnimationFrame(() => {
    inner.querySelectorAll('.card.is-top').forEach(card => {
      const h = card.offsetHeight;
      const spineY = parseInt(card.dataset.spineCy);
      const stem   = parseInt(card.dataset.stem);
      card.style.top = (spineY - stem - h) + 'px';

      // Update connector endpoint
      const cx = parseFloat(card.dataset.cx);
      // Redraw all connectors after heights known
    });
    redrawConnectors(inner, svg, layout);
  });
}

function addConnector(svg, x1, y1, x2, y2, isTop, type) {
  const dx = Math.abs(x2 - x1);
  const strokeC = type === 'profile' ? '#b8960c' : type === 'signpost' ? '#3a3a3a' : '#7b241c';
  const dash    = type === 'profile' ? '4 3' : null;

  let d;
  if (false) {
    // Straight vertical (disabled — always use elbow)
    d = `M ${x1} ${y1} L ${x2} ${y2}`;
  } else {
    // Elbow: vertical segment then horizontal
    const elbowY = isTop ? y2 + 6 : y2 - 6;
    d = `M ${x1} ${y1} L ${x1} ${elbowY} L ${x2} ${elbowY} L ${x2} ${y2}`;
  }

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  path.setAttribute('stroke', strokeC);
  path.setAttribute('stroke-width', '1.5');
  path.setAttribute('fill', 'none');
  if (dash) path.setAttribute('stroke-dasharray', dash);
  svg.appendChild(path);
}

function redrawConnectors(inner, svg, layout) {
  svg.innerHTML = '';
  const STEM = 22;

  layout.forEach(({ year, yearX, topCards, botCards }) => {
    topCards.forEach(({ ev, cx }) => {
      const cards = [...inner.querySelectorAll('.card.is-top')];
      const card = cards.find(c => parseFloat(c.dataset.cx) === cx && c.dataset.year === String(year));
      const cardH = card ? card.offsetHeight : 280;
      const cardBotY = SPINE_CY - STEM;
      addConnector(svg, yearX, SPINE_CY, cx, cardBotY, true, ev.type);
    });
    botCards.forEach(({ ev, cx }) => {
      const cardTopY = SPINE_CY + STEM;
      addConnector(svg, yearX, SPINE_CY, cx, cardTopY, false, ev.type);
    });
  });
}

// ── CARD BUILDER ─────────────────────────────────────────────────────────
function imgHtml(key, alt) {
  const fit = IMG_FIT[key] || 'center center';
  if (key && IMGS[key]) {
    return `<img src="${IMGS[key]}" alt="${alt||''}" style="object-position:${fit}">`;
  }
  return `<div class="card-placeholder"><span>Photo pending</span></div>`;
}

function buildCard(ev, isTop) {
  const card = document.createElement('div');
  const posClass = isTop ? ' is-top' : ' is-bottom';
  const yr = dispYear(ev.year);
  card.dataset.year = ev.year;

  if (ev.type === 'event') {
    card.className = 'card' + posClass;
    card.innerHTML = imgHtml(ev.img, ev.title) +
      `<div class="card-body">
        <div class="card-yr">${yr}</div>
        <div class="card-title">${ev.title}</div>
        <div class="card-short">${ev.short}</div>
      </div>`;
    card.addEventListener('click', () => openEvent(ev));

  } else if (ev.type === 'profile') {
    card.className = 'card profile' + posClass;
    card.innerHTML = imgHtml(ev.img, ev.name) +
      `<div class="card-body">
        <div class="profile-badge">&#9679; Profile</div>
        <div class="card-title">${ev.name}</div>
        <div class="card-role">${ev.role}</div>
        <div class="card-short">${ev.short}</div>
      </div>`;
    card.addEventListener('click', () => openProfile(ev));

  } else if (ev.type === 'signpost') {
    card.className = 'card signpost' + posClass;
    const items = ev.items.map(it =>
      `<div class="sp-item"><div class="sp-title">${it.title}</div><div class="sp-desc">${it.desc}</div></div>`
    ).join('');
    card.innerHTML = `<div class="card-body" style="padding-top:.7rem">${items}</div>`;
    card.addEventListener('click', () => openSignpost(ev));

  } else if (ev.type === 'combo') {
    card.className = 'card' + posClass;
    const bullets = ev.bullets.map(b =>
      `<div class="combo-item"><div class="combo-item-title">${b.title}</div><div class="combo-item-desc">${b.desc}</div></div>`
    ).join('');
    card.innerHTML = imgHtml(ev.img, ev.title) +
      `<div class="card-body">
        <div class="card-yr">${yr}</div>
        <div class="card-title">${ev.title}</div>
        <div class="card-short">${ev.short}</div>
        <hr class="combo-divider">${bullets}
      </div>`;
    card.addEventListener('click', () => openEvent(ev));

  } else if (ev.type === 'combined') {
    card.className = 'card is-bottom';
    card.innerHTML = imgHtml(ev.img, ev.title) +
      `<div class="card-body">
        <div class="card-yr">${yr}</div>
        <div class="card-title">${ev.title}</div>
        <div class="card-short">${ev.short}</div>
      </div>
      <hr class="combined-divider">
      <div class="combined-profile">
        <div class="combined-label">&#9679; Profile</div>
        <div class="combined-name">${ev.name}</div>
        <div class="combined-role">${ev.role}</div>
        <div class="combined-bio">${ev.bio}</div>
      </div>`;
    card.addEventListener('click', () => openCombined(ev));
  }

  return card;
}

// ── MODALS ────────────────────────────────────────────────────────────────
function setImg(key, alt) {
  const el = document.getElementById('mImg');
  if (key && IMGS[key]) {
    el.src = IMGS[key]; el.alt = alt || '';
    el.style.objectPosition = IMG_FIT[key] || 'center center';
    el.style.display = 'block';
  } else { el.style.display = 'none'; }
}
function openModal(borderColor) {
  document.getElementById('modalBox').style.borderTopColor = borderColor || 'var(--red)';
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function openEvent(ev) {
  setImg(ev.img, ev.title);
  document.getElementById('mYr').textContent = dispYear(ev.year);
  document.getElementById('mTitle').textContent = ev.title;
  document.getElementById('mText').textContent = ev.detail;
  document.getElementById('mExtra').innerHTML = ev.bullets
    ? ev.bullets.map(b =>
        `<div class="modal-section"><div class="modal-section-lbl">Also ${dispYear(ev.year)}</div>
        <strong style="color:var(--white);display:block;margin-bottom:.35rem;font-size:.95rem;text-transform:uppercase">${b.title}</strong>
        <span style="font-size:.87rem;font-weight:300;color:#c8c4bc;line-height:1.72">${b.desc}</span></div>`
      ).join('') : '';
  openModal();
}
function openProfile(ev) {
  setImg(ev.img, ev.name);
  document.getElementById('mYr').textContent = ev.role;
  document.getElementById('mTitle').textContent = ev.name;
  document.getElementById('mText').textContent = ev.bio;
  document.getElementById('mExtra').innerHTML = '';
  openModal('#b8960c');
}
function openSignpost(ev) {
  document.getElementById('mImg').style.display = 'none';
  document.getElementById('mYr').textContent = dispYear(ev.year);
  document.getElementById('mTitle').textContent = ev.items.map(i => i.title).join(' / ');
  document.getElementById('mText').innerHTML = '';
  document.getElementById('mExtra').innerHTML = ev.items.map(it =>
    `<div class="modal-section">
      <strong style="color:var(--white);display:block;font-size:.95rem;text-transform:uppercase;margin-bottom:.35rem">${it.title}</strong>
      <span style="font-size:.87rem;font-weight:300;color:#c8c4bc;line-height:1.72">${it.desc}</span>
    </div>`).join('');
  openModal('#3a3a3a');
}
function openCombined(ev) {
  setImg(ev.img, ev.title);
  document.getElementById('mYr').textContent = dispYear(ev.year);
  document.getElementById('mTitle').textContent = ev.title;
  document.getElementById('mText').textContent = ev.detail;
  document.getElementById('mExtra').innerHTML =
    `<div class="modal-section">
      <div class="modal-section-lbl" style="color:var(--gold)">&#9679; Profile: ${ev.name}</div>
      <div style="font-size:.84rem;color:#aaa;margin-bottom:.4rem">${ev.role}</div>
      <div style="font-size:.87rem;font-weight:300;color:#c8c4bc;line-height:1.75">${ev.bio}</div>
    </div>`;
  openModal();
}

document.getElementById('mClose').onclick = closeModal;
document.getElementById('modal').onclick = e => { if (e.target === document.getElementById('modal')) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function closeModal() { document.getElementById('modal').classList.remove('open'); document.body.style.overflow = ''; }

// ── SCROLL ────────────────────────────────────────────────────────────────
const scroller = document.getElementById('tlScroll');
let drag = false, sx, sl;
scroller.addEventListener('mousedown', e => { drag = true; sx = e.pageX - scroller.offsetLeft; sl = scroller.scrollLeft; });
document.addEventListener('mouseup', () => drag = false);
document.addEventListener('mousemove', e => { if (!drag) return; e.preventDefault(); scroller.scrollLeft = sl - (e.pageX - scroller.offsetLeft - sx) * 1.4; });
scroller.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); scroller.scrollLeft += e.deltaY * 2; } }, { passive: false });

function jumpTo(year) {
  const node = document.querySelector(`.year-node[data-year="${year}"]`);
  if (!node) return;
  const r = node.getBoundingClientRect();
  const sr = scroller.getBoundingClientRect();
  scroller.scrollLeft += r.left - sr.left - sr.width / 2 + r.width / 2;
}

build();
</script>
