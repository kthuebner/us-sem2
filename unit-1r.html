  :root{ color-scheme:dark; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:linear-gradient(180deg,var(--red-mid) 0%,var(--red-deep) 45%,var(--red-darkest) 100%);
    background-attachment:fixed;background-color:var(--red-darkest);color:var(--cream);
    font-family:"EB Garamond",Georgia,serif;font-size:19px;line-height:1.55}
  .wrap{max-width:1180px;margin:0 auto;padding:0 40px 90px}

  /* masthead */
  header.mast{height:min(78vh,560px);min-height:400px;display:flex;align-items:flex-end;
    background-image:
      linear-gradient(90deg,rgba(20,6,7,0.55) 0%,rgba(20,6,7,0.18) 50%,rgba(20,6,7,0) 100%),
      linear-gradient(180deg,rgba(90,16,18,0) 45%,rgba(60,10,12,0.75) 82%,var(--red-mid) 100%),
      var(--mast);
    background-size:cover,cover,cover;background-position:center,center,center 35%}
  .mast .in{max-width:1180px;width:100%;margin:0 auto;padding:0 40px 44px}
  .eyebrow{font-family:Oswald,sans-serif;font-weight:400;font-size:.9rem;letter-spacing:.34em;
    text-transform:uppercase;color:var(--gold);margin:0 0 8px}
  .mast h1{font-family:Oswald,sans-serif;font-weight:400;font-size:clamp(64px,9vw,112px);letter-spacing:.03em;
    text-transform:uppercase;margin:0;line-height:.95;text-shadow:0 4px 24px rgba(0,0,0,.6)}
  .mast .years{font-style:italic;color:#efe8db;margin:12px 0 0;font-size:24px;text-shadow:0 2px 10px rgba(0,0,0,.7)}

  /* sections */
  section{margin-top:64px}
  h2{font-family:Oswald,sans-serif;font-weight:300;letter-spacing:.08em;text-transform:uppercase;
    font-size:27px;margin:0 0 6px;display:flex;align-items:baseline;gap:14px}
  h2 .num{font-weight:400;color:var(--gold);font-size:19px;letter-spacing:.1em}
  .lead{color:var(--muted);font-style:italic;margin:0 0 22px;max-width:780px}
  .lead b{color:var(--cream);font-style:normal;font-weight:500}
  .meta{font-family:Oswald,sans-serif;font-weight:300;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold);margin:0 0 12px}
  .restart{background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer;
    font-family:Oswald,sans-serif;font-weight:300;font-size:11px;letter-spacing:.15em;
    text-transform:uppercase;padding:8px 16px;margin-top:20px}
  .restart:hover{border-color:var(--gold);color:var(--gold)}
  .box{border:1px solid var(--line);background:rgba(0,0,0,0.22);padding:22px 24px}

  /* flip cards */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{perspective:1200px;height:360px;cursor:pointer;outline:none}
  .card .inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px;text-align:center}
  .card .front{background:rgba(0,0,0,0.28)}
  .card .back{background:#2a0d0f;transform:rotateY(180deg);border-color:var(--gold)}
  .card:focus-visible .face{box-shadow:0 0 0 2px var(--gold)}
  .q-tag{font-family:Oswald,sans-serif;font-weight:300;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold);margin-bottom:16px}
  .q-text{font-family:Oswald,sans-serif;font-weight:300;font-size:30px;line-height:1.2;max-width:16ch}
  .a-text{font-size:19px;line-height:1.5;max-width:34ch}
  .flip-hint{position:absolute;bottom:16px;font-family:Oswald,sans-serif;font-weight:300;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

  /* chips and trays */
  .tray{display:flex;flex-wrap:wrap;gap:10px;min-height:52px;padding:14px;margin:0 0 18px;
    border:1px dashed var(--line);background:rgba(0,0,0,0.2)}
  .tray-label{font-family:Oswald,sans-serif;font-weight:300;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .chip{font-family:Oswald,sans-serif;font-weight:400;font-size:15px;letter-spacing:.03em;
    background:var(--cream);color:#1d1d1d;border:0;padding:8px 14px;cursor:grab;user-select:none;
    -webkit-user-select:none;line-height:1.25;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,0.35)}
  .chip.deed{font-family:"EB Garamond",Georgia,serif;font-weight:400;font-size:16px;max-width:330px;letter-spacing:0}
  .chip:hover{background:#fff}
  .chip.sel{outline:3px solid var(--gold);outline-offset:2px}
  .chip.dragging{opacity:.4}
  .chip.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .tries{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
  .tries i{width:8px;height:8px;border-radius:50%;border:1px solid var(--muted);display:inline-block}
  .tries i.used{background:var(--bad);border-color:var(--bad)}
  .placed{font-family:Oswald,sans-serif;font-weight:400;color:var(--ok);letter-spacing:.03em}
  .closedtxt{font-family:Oswald,sans-serif;font-weight:300;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--bad)}
  .pts{font-family:Oswald,sans-serif;font-weight:300;font-size:12px;color:var(--gold);margin-left:8px;letter-spacing:.1em}
  .target.hot{outline:2px dashed var(--gold);outline-offset:3px}

  /* cause cloud */
  .cloud{position:relative;container-type:inline-size;aspect-ratio:16/8;border:1px dashed var(--line);
    background:radial-gradient(ellipse at center,rgba(255,255,255,0.07) 0%,rgba(0,0,0,0.25) 70%);overflow:hidden}
  .cloud.hot{outline:2px dashed var(--gold);outline-offset:3px}
  .cloud-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:Oswald,sans-serif;font-weight:300;letter-spacing:.24em;text-transform:uppercase;font-size:14px;color:var(--muted)}
  .word{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));white-space:nowrap;
    font-family:Oswald,sans-serif;line-height:1;letter-spacing:.01em;animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.2)}
    100%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1)}}
  .cloud-ph[hidden]{display:none}
  .cloud-note{color:var(--gold);font-style:italic;margin:14px 0 0}
  .cloud-note[hidden]{display:none}
  .gone{margin-top:10px;font-size:16px;color:var(--muted)}
  @media(max-width:600px){
    .cloud{aspect-ratio:auto;min-height:260px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px 14px;padding:18px}
    .word{position:static;transform:none;animation:none;font-size:var(--m) !important;white-space:normal;text-align:center;max-width:100%}
  }

  /* the road and the roots */
  .roadwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 0}
  .road{display:grid;align-items:stretch;min-width:980px}
  .cap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-family:Oswald,sans-serif;font-weight:300;font-size:13px;line-height:1.25;padding:10px;z-index:1}
  .cap b{display:block;font-weight:400;color:var(--gold);font-size:12px;letter-spacing:.12em;margin-bottom:4px}
  .cap.start{background:#232b2e;border-radius:50%;width:108px;height:108px;font-size:12px;align-self:center;border:1px solid var(--line)}
  .cap.end{background:#1a1112;border:2px solid var(--bad);margin-left:6px;text-transform:uppercase;letter-spacing:.02em;font-size:13.5px;line-height:1.2}
  .step{position:relative;background:#33393b;margin-right:-9px;min-height:178px;padding:12px 20px 12px 24px;cursor:pointer;
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:background .2s}
  .step:nth-child(odd){background:#2d3335}
  .step.hot{background:#5d533a}
  .step.ok{background:#3c4a3a}
  .step.closed{background:#4f3330}
  .step .when{font-family:Oswald,sans-serif;font-weight:400;font-size:12px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
  .step .ico{width:46px;height:46px;color:var(--cream);opacity:.5;transform:none}
  .step .lab{font-family:Oswald,sans-serif;font-weight:300;font-size:14px;line-height:1.25;color:var(--cream)}
  .step .tries{margin:0}
  .step.ok .ico,.step.given .ico{opacity:1}
  .step.ok .ico{animation:icopop .5s cubic-bezier(.2,1.5,.4,1)}
  @keyframes icopop{0%{transform:scale(.5)}100%{transform:scale(1)}}
  .soil{position:relative;margin-top:14px;padding:34px 18px 18px;border-top:2px solid #5b4f3a;
    background:linear-gradient(180deg,#2b2620 0%,#1c1915 100%)}
  .soil .tag{position:absolute;top:8px;left:16px;font-family:Oswald,sans-serif;font-weight:300;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:#bfa77a}
  .roots{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .root{position:relative;min-height:64px;border:1px dashed rgba(191,167,122,.45);display:flex;align-items:center;
    justify-content:center;text-align:center;padding:10px;font-family:Oswald,sans-serif;font-size:15px;cursor:pointer}
  .root::before{content:"";position:absolute;left:50%;top:-34px;height:33px;border-left:1px solid rgba(191,167,122,.55)}
  .root::after{content:"";position:absolute;left:calc(50% - 14px);top:-18px;width:14px;height:12px;
    border-left:1px solid rgba(191,167,122,.4);border-top:1px solid rgba(191,167,122,.4);border-radius:10px 0 0 0}
  .root .ph{color:#a7987c;font-style:italic;font-family:"EB Garamond",Georgia,serif;font-size:15px}
  .root.ok{border-style:solid;border-color:var(--ok);background:rgba(127,174,122,.08)}
  .root.closed{border-style:solid;border-color:var(--bad)}
  .root.hot{background:rgba(201,169,97,.14)}
  .rise-note{color:var(--gold);font-style:italic;margin:14px 0 0}
  .rise-note[hidden]{display:none}
  @media(max-width:900px){
    .roadwrap{overflow:visible}
    .road{display:flex;flex-direction:column;min-width:0}
    .cap.start{width:auto;height:auto;border-radius:0;align-self:stretch}
    .cap.end{margin:4px 0 0}
    .step{margin:0 0 -6px;min-height:0;padding:14px 16px 22px;flex-direction:row;flex-wrap:wrap;justify-content:center;
      clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),50% 100%,0 calc(100% - 10px))}
    .step .ico{width:34px;height:34px}
    .roots{grid-template-columns:1fr 1fr}
    .root::before,.root::after{display:none}
    .soil{padding-top:36px}
  }

  /* korean war phases map */
  .mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line)}
  .mapinner{min-width:820px}
  .mapboard{position:relative;width:100%;line-height:0}
  .mapboard img{width:100%;height:auto;display:block}
  .panel{position:absolute;top:0;bottom:0;z-index:1}
  .panel.hot{outline:3px dashed var(--gold);outline-offset:-4px;background:rgba(214,180,106,.12)}
  .pin{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;z-index:3;
    background:#1f1f1f;color:var(--cream);border:2px solid var(--cream);font-family:Oswald,sans-serif;
    font-weight:400;font-size:15px;line-height:28px;text-align:center;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.55);pointer-events:none}
  .pin.ok{background:var(--ok);color:#10200f;border-color:#dfeedd}
  .pin.closed{background:var(--bad);border-color:#f2d6d2}
  .pin.hot{box-shadow:0 0 0 4px var(--gold)}
  .mapdeco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  .mapdeco path{stroke:#1f1f1f;stroke-width:2.2;fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .mapdeco circle{fill:#1f1f1f}
  .phasestrip{display:grid;grid-template-columns:290fr 270fr 270fr 269fr;gap:8px;padding:10px 8px;background:rgba(0,0,0,.28);line-height:1.35}
  .phase{min-height:96px;border:1px dashed var(--line);padding:10px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;cursor:pointer;font-size:16px}
  .phase .ph{color:var(--muted);font-style:italic;font-size:15px}
  .phase .pn{font-family:Oswald,sans-serif;font-weight:400;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
  .phase.ok{border-style:solid;border-color:var(--ok)}
  .phase.closed{border-style:solid;border-color:var(--bad)}
  .phase .placed{font-family:"EB Garamond",Georgia,serif;font-size:16px;letter-spacing:0}
  .scrollnote{display:none;font-size:15px;color:var(--muted);font-style:italic;margin:8px 0 0}
  .legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 18px;margin:18px 0 0;padding:0;list-style:none}
  .legend li{border-bottom:1px solid var(--line);padding:6px 4px;min-height:40px;display:flex;align-items:center;gap:8px;cursor:pointer}
  .legend li b{font-family:Oswald,sans-serif;font-weight:400;color:var(--gold);min-width:22px}
  .legend li .empty{color:var(--muted);font-style:italic;font-size:15px}
  .after-map{margin-top:22px}

  /* who fought the korean war */
  .sides{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px;align-items:start}
  .sidesboard{position:relative;line-height:0;border:1px solid var(--line);position:sticky;top:12px}
  .sidesboard img{width:100%;height:auto;display:block}
  .spot{position:absolute;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%)}
  .spot.hot{outline:3px dashed var(--gold);outline-offset:2px;background:rgba(214,180,106,.18)}
  .spot .badge{position:absolute;left:4%;top:4%;width:30px;height:30px;border-radius:50%;background:#1f1f1f;color:var(--cream);
    border:2px solid var(--cream);font-family:Oswald,sans-serif;font-size:15px;line-height:26px;text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.55)}
  .spot.done .badge{background:var(--ok);color:#10200f;border-color:#dfeedd}
  .siderows{display:flex;flex-direction:column;gap:12px}
  .siderow{display:grid;grid-template-columns:34px 1fr;gap:8px 12px;align-items:start;border:1px solid var(--line);
    background:rgba(0,0,0,0.22);padding:12px}
  .siderow > b{grid-row:span 2;font-family:Oswald,sans-serif;font-weight:400;color:var(--gold);font-size:22px;text-align:center;line-height:1.6}
  .siderow .slot{min-height:42px}

  /* leaders */
  .leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .leader{border:1px solid var(--line);background:rgba(0,0,0,0.22);padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .oval{width:156px;height:195px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:#222}
  .oval img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
  .slot{width:100%;min-height:46px;border:1px dashed var(--line);padding:8px 10px;font-size:16px;
    display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;line-height:1.35}
  .slot .ph{color:var(--muted);font-style:italic;font-size:15px}
  .slot.ok{border-style:solid;border-color:var(--ok)}
  .slot.closed{border-style:solid;border-color:var(--bad)}
  .slot.name-slot{font-family:Oswald,sans-serif}

  /* terms */
  .defs{display:grid;grid-template-columns:1fr;gap:10px}
  .def{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:center;border:1px solid var(--line);
    background:rgba(0,0,0,0.22);padding:12px 16px}
  .def .slot{min-height:44px}
  .def p{margin:0;font-size:18px}
  .roundbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 14px}
  .next{background:var(--gold);color:#1d1d1d;border:0;cursor:pointer;font-family:Oswald,sans-serif;
    font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:10px 20px}
  .next[hidden]{display:none}
  .done{font-family:Oswald,sans-serif;font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);font-size:14px}

  /* score */
  .scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
  .rows{list-style:none;margin:0;padding:0}
  .rows li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 2px;
    font-family:Oswald,sans-serif;font-weight:300;letter-spacing:.06em;text-transform:uppercase;font-size:16px}
  .rows li.total{font-weight:400;font-size:20px;border-bottom:2px solid var(--gold)}
  .rows li span:last-child{font-weight:400}
  .stampwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .acc{font-family:Oswald,sans-serif;font-weight:300;font-size:64px;line-height:1}
  .acc-l{font-family:Oswald,sans-serif;font-weight:300;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .stamp{font-family:Oswald,sans-serif;font-weight:500;font-size:22px;letter-spacing:.14em;text-transform:uppercase;
    border:3px solid currentColor;padding:8px 18px;transform:rotate(-6deg);opacity:.9}
  .stamp[hidden]{display:none}
  .rule{font-size:16px;color:var(--muted);font-style:italic;margin:22px 0 0;max-width:780px}
  .runs{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
  .runs h3{font-family:Oswald,sans-serif;font-weight:300;letter-spacing:.1em;text-transform:uppercase;font-size:17px;margin:0 0 6px}
  .runs p{margin:4px 0;font-size:17px}
  .checks{display:flex;gap:18px;margin:14px 0 12px}
  .check{width:72px;height:72px;border:2px solid rgba(244,242,235,.35);background:rgba(0,0,0,.25);display:flex;
    align-items:center;justify-content:center;position:relative}
  .check span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-family:Oswald,sans-serif;font-weight:300;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .check svg{width:52px;height:52px;opacity:0}
  .check.on{border-color:#6fbf68;background:rgba(111,191,104,.14)}
  .check.on svg{opacity:1}
  .check.new svg{animation:tick .6s cubic-bezier(.2,1.5,.4,1)}
  @keyframes tick{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1);opacity:1}}
  .runs .checks + p{margin-top:28px}

  /* given (head start) slots, kept for the engine */
  .given-txt{font-family:Oswald,sans-serif;color:#a9b3a6;letter-spacing:.03em}
  .given-tag{font-family:Oswald,sans-serif;font-weight:300;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8f998c;margin-left:8px}
  .slot.given,.root.given{border-style:solid;border-color:rgba(169,179,166,.35);background:rgba(255,255,255,.03)}
  .step.given{background:#363b35}
  .step.given .lab{color:#b9c2b6}
  .pin.given{background:#59634f;color:#e6ece3;border-color:#c9d3c4}

  @media(max-width:900px){
    .wrap{padding:0 16px 70px}
    .mast .in{padding:0 16px 22px}
    header.mast{height:320px;min-height:0;background-position:center,center,30% center}
    .mast h1{font-size:46px}
    .mast .years{font-size:19px}
    .cards,.leaders{grid-template-columns:1fr}
    .card{height:320px}
    .legend{grid-template-columns:1fr 1fr}
    .scrollnote{display:block}
    .def{grid-template-columns:1fr}
    .scoregrid{grid-template-columns:1fr}
    .sides{grid-template-columns:1fr}
    .sidesboard{position:relative;top:auto}
    .spot .badge{width:24px;height:24px;line-height:20px;font-size:12px}
  }
  .cards.four{grid-template-columns:repeat(2,1fr)}
  .cards.four .card{height:300px}
  @media(max-width:900px){ .cards.four{grid-template-columns:1fr} }
</style>
</head>

const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function triesDots(max, used){ const s = el('span', 'tries'); for (let i = 0; i < max; i++){ const d = el('i'); if (i < used) d.className = 'used'; s.appendChild(d); } return s; }

function makeChip(label, value, board, extraCls){
  const c = el('div', 'chip' + (extraCls ? ' ' + extraCls : ''), label);
  c.setAttribute('role', 'button'); c.tabIndex = 0; c.draggable = true; c.dataset.value = value; c.dataset.board = board;
  c.addEventListener('dragstart', e => { clearSel(); c.classList.add('dragging');
    e.dataTransfer.setData('text/plain', board); e.dataTransfer.effectAllowed = 'move'; window.__drag = c; });
  c.addEventListener('dragend', () => { c.classList.remove('dragging'); window.__drag = null; });
  c.addEventListener('click', e => { e.stopPropagation();
    if (selected && selected.chip === c){ clearSel(); return; }
    clearSel(); selected = { chip: c, board }; c.classList.add('sel'); });
  c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); c.click(); } });
  return c;
}
function makeTarget(node, board, accepts, onDrop){
  node.classList.add('target');
  node.addEventListener('dragover', e => { const c = window.__drag; if (!c || c.dataset.board !== board || !accepts(c)) return;
    e.preventDefault(); node.classList.add('hot'); });
  node.addEventListener('dragleave', () => node.classList.remove('hot'));
  node.addEventListener('drop', e => { e.preventDefault(); node.classList.remove('hot'); const c = window.__drag;
    if (c && c.dataset.board === board && accepts(c)){ e.stopPropagation(); window.__drag = null; onDrop(c); } });
  node.addEventListener('click', e => { if (selected && selected.board === board && accepts(selected.chip)){
    e.stopPropagation(); const c = selected.chip; clearSel(); onDrop(c); } });
}
function bounce(c){ c.classList.remove('sel'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }

/* slots: three tries, a closed slot hides its answer, a given slot is a head start and does not score */
function slotLogic(opts){
  const MAX = opts.max || 3;
  const findChip = pred => { for (const t of opts.trays){ const ch = [...t.querySelectorAll('.chip')].find(pred); if (ch) return ch; } return null; };
  opts.slots.forEach(s => { s.tries = 0; s.pts = 0; s.state = 'open';
    if (s.given){ s.state = 'given'; s.got = s.given;
      const ch = findChip(x => x.dataset.value === s.given); if (ch) ch.remove();
      if (s.answerSet) s.answerSet.delete(s.given); }
    s.render(s);
    if (!s.noTarget) makeTarget(s.node, opts.board, () => s.state === 'open', c => drop(s, c));
    (s.alt || []).forEach(n => makeTarget(n, opts.board, () => s.state === 'open', c => drop(s, c))); });
  function drop(s, c){
    if (s.state !== 'open') return;
    const right = s.answerSet ? s.answerSet.has(c.dataset.value) : c.dataset.value === s.answer;
    if (right){ s.state = 'ok'; s.pts = 3 - s.tries; s.got = c.dataset.value; c.remove(); if (s.answerSet) s.answerSet.delete(s.got); }
    else { s.tries++; bounce(c);
      if (s.tries >= MAX){ s.state = 'closed';
        const ch = findChip(x => s.answerSet ? s.answerSet.has(x.dataset.value) : x.dataset.value === s.answer);
        if (ch){ if (s.answerSet) s.answerSet.delete(ch.dataset.value); ch.remove(); } } }
    s.render(s); if (opts.report) opts.report(); if (opts.after) opts.after();
  }
  return { slots: opts.slots, drop };
}
const live = slots => slots.filter(s => s.state !== 'given');
function tally(slots){ const L = live(slots);
  return { pts: L.reduce((a, s) => a + s.pts, 0), max: L.length * 3, ok: L.filter(s => s.state === 'ok').length,
    n: L.length, open: L.filter(s => s.state === 'open').length }; }

  /* ----- why was there a cold war ----- */
  function buildWhy(){

  /* ----- the four phases map ----- */

        box.appendChild(el('span', 'pn', 'Phase ' + (i + 1)));
        if (st.state === 'ok'){ box.appendChild(el('span', 'placed', text)); box.appendChild(el('span', 'pts', '+' + st.pts)); }
        else if (st.state === 'closed') box.appendChild(el('span', 'closedtxt', 'Closed'));
        else { box.appendChild(el('span', 'ph', 'What happened?')); box.appendChild(triesDots(3, st.tries)); } } };
    });
    slotLogic({ board: B('phase'), trays: [pTray], slots: pSlots, report: pReport, after(){
      if (pSlots.every(s => s.state !== 'open')) pTray.querySelectorAll('.chip').forEach(c => c.remove()); } });
    function pReport(){ setScore('phases', tally(pSlots)); }
    report(); pReport();
  }

  /* ----- who fought the korean war ----- */
  function buildSides(){
    const C = T.sides, board = $('#sidesboard'), rows = $('#side-rows'), tN = $('#side-names'), tR = $('#side-roles');
    board.querySelectorAll('.spot').forEach(s => s.remove()); rows.innerHTML = ''; tN.innerHTML = ''; tR.innerHTML = '';
    const IW = 993, IH = 761;
    $('#sides-lead').textContent = 'These are the leaders of the two sides in Korea. Give each numbered face a name and a role. '
      + 'Drop on the face or in the matching box. ' + cap(word(C.distract))
      + ' of the names belong to people who are not on the map. Three tries per slot.';
    $('#sides-meta').textContent = cap(word(SIDES.length)) + ' faces, ' + word(SIDES.length * 2) + ' slots to fill';
    const offN = shuffle(SIDE_DECOYS).slice(0, C.distract), offR = [];
    shuffle(SIDES.concat(offN)).forEach(p => tN.appendChild(makeChip(p[1], 'n:' + p[0], B('side-n'))));
    shuffle(SIDES.concat(offR)).forEach(p => tR.appendChild(makeChip(p[2], 'r:' + p[0], B('side-r'), 'deed')));
    const nameSlots = [], roleSlots = [];
    SIDES.forEach(([key, name, role, cx, cy, r], i) => {
      const spot = el('div', 'spot'); spot.style.left = (cx / IW * 100) + '%'; spot.style.top = (cy / IH * 100) + '%';
      spot.style.width = (2 * r / IW * 100) + '%'; spot.style.height = (2 * r / IH * 100) + '%';
      spot.setAttribute('role', 'button'); spot.setAttribute('aria-label', 'Face ' + (i + 1));
      spot.appendChild(el('span', 'badge', String(i + 1))); board.appendChild(spot);
      const row = el('div', 'siderow'); row.appendChild(el('b', '', String(i + 1)));
      const ns = el('div', 'slot name-slot'), rs = el('div', 'slot'); row.appendChild(ns); row.appendChild(rs); rows.appendChild(row);
      const mark = () => spot.classList.toggle('done', nameSlots[i].state !== 'open' && roleSlots[i].state !== 'open');
      const render = (label, ph, isName) => st => { const nd = st.node;
        nd.className = 'slot' + (isName ? ' name-slot' : '') + (st.state === 'ok' ? ' ok' : st.state === 'closed' ? ' closed' : '');
        nd.innerHTML = '';
        if (st.state === 'ok'){ nd.appendChild(el('span', isName ? 'placed' : '', label)); nd.appendChild(el('span', 'pts', '+' + st.pts)); }
        else if (st.state === 'closed') nd.appendChild(el('span', 'closedtxt', 'Closed'));
        else { nd.appendChild(el('span', 'ph', ph)); nd.appendChild(triesDots(3, st.tries)); }
        if (nameSlots[i] && roleSlots[i]) mark(); };
      nameSlots.push({ node: ns, answer: 'n:' + key, alt: [spot, row], render: render(name, 'Name', true) });
      roleSlots.push({ node: rs, answer: 'r:' + key, alt: [spot, row], render: render(role, 'Role in the war', false) });
    });
    slotLogic({ board: B('side-n'), trays: [tN], slots: nameSlots, report });
    slotLogic({ board: B('side-r'), trays: [tR], slots: roleSlots, report });
    function report(){ setScore('sides', tally(nameSlots.concat(roleSlots))); }
    report();
  }

  /* ----- cold war leaders ----- */
  function buildLeaders(){
    const C = T.leaders, box = $('#leaders'), tN = $('#lead-names'), tD = $('#lead-deeds');
    box.innerHTML = ''; tN.innerHTML = ''; tD.innerHTML = '';
    const pool = LEADERS.filter(l => !C.part1 || l[4]).map(l => ({ name: l[0], deed: (C.part1 && l[3]) || l[1], key: l[2] }));
    let on, rest;
    if (C.only){ on = shuffle(pool.filter(p => C.only.includes(p.key))); rest = pool.filter(p => !C.only.includes(p.key)); C.perLoad = on.length; }
    else { const order = shuffle(pool);
      (C.must || []).forEach(k => { const i = order.findIndex(p => p.key === k); if (i >= C.perLoad){ const [m] = order.splice(i, 1); order.splice(Math.floor(Math.random() * C.perLoad), 0, m); } });
      on = order.slice(0, C.perLoad); rest = order.slice(C.perLoad); }
    const hs = C.headStart ? () => C.headStart[0] + Math.floor(Math.random() * (C.headStart[1] - C.headStart[0] + 1)) : () => 0;
    const faces = shuffle(on.map(p => p.key)), nG = hs(), dG = hs();
    const givenN = new Set(faces.slice(0, nG)), givenD = new Set(faces.slice(nG, nG + dG));
    $('#lead-lead').textContent = 'The men who ran the Cold War, some of them for decades after Korea. Two slots per face: the name, and who they were. '
        + (C.only ? '' : 'You get ' + word(C.perLoad) + ' of the ' + word(pool.length) + ' leaders each time, so the set changes. ')
        + cap(word(C.distract)) + ' names and ' + word(C.distract) + ' descriptions in the trays belong to leaders who are not on the board. Three tries per slot.';
    $('#lead-meta').textContent = cap(word(C.perLoad)) + ' faces, ' + word(C.perLoad * 2 - givenN.size - givenD.size) + ' slots to fill';
    const offN = shuffle(rest).slice(0, C.distract), offD = shuffle(rest).slice(0, C.distract);
    shuffle(on.concat(offN)).forEach(p => tN.appendChild(makeChip(p.name, 'n:' + p.key, B('lead-n'))));
    shuffle(on.concat(offD)).forEach(p => tD.appendChild(makeChip(p.deed, 'd:' + p.key, B('lead-d'), 'deed')));
    const nameSlots = [], deedSlots = [];
    on.forEach(p => {
      const card = el('div', 'leader'), ov = el('div', 'oval'), img = el('img');
      img.src = PORTRAITS[p.key] || ''; img.alt = 'Portrait of a Cold War leader'; ov.appendChild(img); card.appendChild(ov);
      const ns = el('div', 'slot name-slot'), ds = el('div', 'slot'); card.appendChild(ns); card.appendChild(ds); box.appendChild(card);
      const render = (label, ph, isName) => st => { const nd = st.node;
        nd.className = 'slot' + (isName ? ' name-slot' : '') + (st.state === 'ok' ? ' ok' : st.state === 'closed' ? ' closed' : st.state === 'given' ? ' given' : '');
        nd.innerHTML = '';
        if (st.state === 'ok'){ nd.appendChild(el('span', isName ? 'placed' : '', label)); nd.appendChild(el('span', 'pts', '+' + st.pts)); }
        else if (st.state === 'given') nd.appendChild(el('span', 'given-txt', label));
        else if (st.state === 'closed') nd.appendChild(el('span', 'closedtxt', 'Closed'));
        else { nd.appendChild(el('span', 'ph', ph)); nd.appendChild(triesDots(3, st.tries)); } };
      nameSlots.push({ node: ns, answer: 'n:' + p.key, given: givenN.has(p.key) ? 'n:' + p.key : null, alt: [card], render: render(p.name, 'Name', true) });
      deedSlots.push({ node: ds, answer: 'd:' + p.key, given: givenD.has(p.key) ? 'd:' + p.key : null, alt: [card], render: render(p.deed, 'Who they were', false) });
    });
    slotLogic({ board: B('lead-n'), trays: [tN], slots: nameSlots, report });
    slotLogic({ board: B('lead-d'), trays: [tD], slots: deedSlots, report });
    function report(){ setScore('leaders', tally(nameSlots.concat(deedSlots))); }
    report();
  }

  /* ----- key terms ----- */
  function buildTerms(){
    const C = T.terms, tray = $('#term-tray'), defs = $('#defs'), nextBtn = $('#next-round'), lab = $('#round-label');
    const eligible = VOCAB.filter(v => C.pools.some(p => p[0] === v[2]));
    let pick = []; C.pools.forEach(([part, k]) => { pick = pick.concat(shuffle(VOCAB.filter(v => v[2] === part)).slice(0, k)); });
    pick = shuffle(pick);
    const spare = shuffle(eligible.filter(v => !pick.includes(v)));
    const rounds = []; for (let i = 0; i < pick.length; i += C.round) rounds.push(pick.slice(i, i + C.round));
    $('#terms-lead').textContent = 'There are ' + eligible.length + ' terms from the slides. Every time you load this page you get a random '
      + pick.length + ' in ' + word(rounds.length) + ' rounds of ' + word(C.round) + '. Drag each term onto its definition. '
      + cap(word(C.distract)) + ' terms in each tray do not match anything. Three tries per definition, and after the third miss that slot closes for good.';
    const results = pick.map(() => ({ state: 'open', pts: 0 }));
    let r = 0, spareAt = 0;
    nextBtn.onclick = () => { if (r < rounds.length - 1){ r++; show(); } };
    function show(){
      tray.innerHTML = ''; defs.innerHTML = ''; nextBtn.hidden = true;
      lab.textContent = 'Round ' + (r + 1) + ' of ' + rounds.length;
      const items = rounds[r], base = r * C.round;
      const dist = spare.slice(spareAt, spareAt + C.distract); spareAt += C.distract;
      shuffle(items.concat(dist)).forEach(t => tray.appendChild(makeChip(t[0], t[0], B('terms'))));
      const slots = shuffle(items.map((t, k) => ({ t, k }))).map(({ t, k }) => {
        const row = el('div', 'def'), sl = el('div', 'slot name-slot'); row.appendChild(sl); row.appendChild(el('p', '', t[1])); defs.appendChild(row);
        return { node: sl, answer: t[0], alt: [row], render(st){
          sl.className = 'slot name-slot' + (st.state === 'ok' ? ' ok' : st.state === 'closed' ? ' closed' : ''); sl.innerHTML = '';
          if (st.state === 'ok'){ sl.appendChild(el('span', 'placed', t[0])); sl.appendChild(el('span', 'pts', '+' + st.pts)); }
          else if (st.state === 'closed') sl.appendChild(el('span', 'closedtxt', 'Closed'));
          else { sl.appendChild(el('span', 'ph', 'Drop a term')); sl.appendChild(triesDots(3, st.tries)); }
          results[base + k] = { state: st.state, pts: st.pts }; } };
      });
      slotLogic({ board: B('terms'), trays: [tray], slots, report, after(){
        if (slots.every(s => s.state !== 'open')){
          if (r < rounds.length - 1) nextBtn.hidden = false;
          else { tray.innerHTML = ''; tray.appendChild(el('span', 'done', 'All rounds finished')); } } } });
    }
    function report(){ setScore('terms', tally(results)); }
    show(); report();
  }

  const BUILDERS = { why: buildWhy, map: buildMap, sides: buildSides, leaders: buildLeaders, terms: buildTerms };
  T.sections.forEach(k => BUILDERS[k]());
  panel.querySelectorAll('[data-restart]').forEach(b => b.addEventListener('click', () => { clearSel(); BUILDERS[b.dataset.restart](); }));
  paintRuns();
}

/* ===================== start ===================== */
(function(){
  const panels = document.getElementById('panels');
  TABS.forEach(T => { const p = el('div', 'tabpanel'); p.id = 'panel-' + T.id; panels.appendChild(p); buildTab(T, p); });
})();
</script>
