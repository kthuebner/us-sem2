  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:linear-gradient(180deg,var(--page) 0%,var(--page-2) 100%);background-attachment:fixed;background-color:var(--page-2);
    color:var(--ink);font-family:"EB Garamond",Georgia,serif;font-size:19px;line-height:1.55}
  .wrap{max-width:1180px;margin:0 auto;padding:0 40px 90px}

  /* masthead */
  header.mast{height:280px;display:flex;align-items:flex-end;
    background-image:
      linear-gradient(90deg,rgba(16,32,50,0.86) 0%,rgba(20,44,70,0.6) 45%,rgba(30,60,95,0.25) 100%),
      linear-gradient(180deg,rgba(27,53,80,0) 55%,rgba(27,53,80,0.85) 100%),
      var(--mast);
    background-size:cover,cover,cover;background-position:center,center,center 70%;color:#fff}
  .mast .in{max-width:1180px;width:100%;margin:0 auto;padding:0 40px 28px}
  .eyebrow{font-family:Oswald,sans-serif;font-weight:300;font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:#a9c8e6;margin:0 0 8px}
  .mast h1{font-family:Oswald,sans-serif;font-weight:300;font-size:56px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
  .mast .years{font-style:italic;color:#d3dde7;margin:8px 0 0;font-size:20px}

  /* sections */
  section{margin-top:60px}
  h2{font-family:Oswald,sans-serif;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);
    font-size:27px;margin:0 0 6px;display:flex;align-items:baseline;gap:14px;padding-bottom:6px;border-bottom:2px dashed rgba(52,112,165,.45)}
  h2 .num{font-weight:400;color:var(--blue);font-size:19px;letter-spacing:.1em}
  .lead{color:var(--muted);font-style:italic;margin:10px 0 22px;max-width:780px}
  .lead b{color:var(--ink);font-style:normal;font-weight:500}
  .meta{font-family:Oswald,sans-serif;font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin:0 0 12px}
  .restart{background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer;font-family:Oswald,sans-serif;font-weight:400;
    font-size:11px;letter-spacing:.15em;text-transform:uppercase;padding:8px 16px;margin-top:20px}
  .restart:hover{border-color:var(--blue);color:var(--blue)}
  .box{border:1px solid var(--line);background:var(--paper);padding:22px 24px;box-shadow:0 1px 3px rgba(0,0,0,.06)}

  /* flip cards */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{perspective:1200px;height:340px;cursor:pointer;outline:none}
  .card .inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:26px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .card .front{background:var(--blue);color:#fff}
  .card .back{background:var(--paper);transform:rotateY(180deg);border:2px solid var(--blue);color:var(--ink)}
  .card:focus-visible .face{box-shadow:0 0 0 3px var(--navy)}
  .q-tag{font-family:Oswald,sans-serif;font-weight:400;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#cfe0f0;margin-bottom:16px}
  .back .q-tag{color:var(--blue)}
  .q-text{font-family:Oswald,sans-serif;font-weight:300;font-size:28px;line-height:1.2;max-width:18ch}
  .a-text{font-size:19px;line-height:1.5;max-width:32ch}
  .flip-hint{position:absolute;bottom:16px;font-family:Oswald,sans-serif;font-weight:300;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#cfe0f0}
  .back .flip-hint{color:var(--muted)}

  /* chips and trays */
  .tray{display:flex;flex-wrap:wrap;gap:10px;min-height:52px;padding:14px;margin:0 0 18px;border:1px dashed rgba(52,112,165,.45);background:var(--blue-ll)}
  .tray-label{font-family:Oswald,sans-serif;font-weight:400;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .chip{font-family:Oswald,sans-serif;font-weight:400;font-size:15px;letter-spacing:.03em;background:var(--paper);color:var(--ink);
    border:1px solid var(--line);border-left:4px solid var(--blue);padding:8px 14px;cursor:grab;user-select:none;-webkit-user-select:none;
    line-height:1.25;text-align:left;box-shadow:0 2px 0 rgba(27,53,80,0.18)}
  .chip.deed{font-family:"EB Garamond",Georgia,serif;font-size:16px;max-width:330px;letter-spacing:0}
  .chip:hover{background:#f7fbff}
  .chip.sel{outline:3px solid var(--navy);outline-offset:2px}
  .chip.dragging{opacity:.4}
  .chip.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .tries{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
  .tries i{width:8px;height:8px;border-radius:50%;border:1px solid var(--muted);display:inline-block}
  .tries i.used{background:var(--bad);border-color:var(--bad)}
  .placed{font-family:Oswald,sans-serif;font-weight:400;color:var(--ok);letter-spacing:.03em}
  .closedtxt{font-family:Oswald,sans-serif;font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bad)}
  .pts{font-family:Oswald,sans-serif;font-weight:400;font-size:12px;color:var(--blue);margin-left:8px;letter-spacing:.1em}
  .target.hot{outline:2px dashed var(--blue);outline-offset:3px}

  /* cause cloud */
  .cloud{position:relative;container-type:inline-size;aspect-ratio:16/8;border:1px dashed rgba(52,112,165,.45);
    background:radial-gradient(ellipse at center,#ffffff 0%,#eef3f8 60%,#dbe6f1 100%);overflow:hidden}
  .cloud.hot{outline:2px dashed var(--blue);outline-offset:3px}
  .cloud-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Oswald,sans-serif;font-weight:300;
    letter-spacing:.24em;text-transform:uppercase;font-size:14px;color:var(--muted)}
  .word{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));white-space:nowrap;font-family:Oswald,sans-serif;line-height:1;
    letter-spacing:.01em;animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.2)}100%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1)}}
  .cloud-ph[hidden]{display:none}
  .cloud-note{color:var(--blue-d);font-style:italic;margin:14px 0 0}
  .cloud-note[hidden]{display:none}
  .gone{margin-top:10px;font-size:16px;color:var(--bad)}
  @media(max-width:600px){
    .cloud{aspect-ratio:auto;min-height:260px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px 14px;padding:18px}

const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function triesDots(max, used){ const s = el('span', 'tries'); for (let i = 0; i < max; i++){ const d = el('i'); if (i < used) d.className = 'used'; s.appendChild(d); } return s; }
const WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];

let selected = null;
function clearSel(){ if (selected){ selected.chip.classList.remove('sel'); selected = null; } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearSel(); });
['dragend', 'drop'].forEach(t => document.addEventListener(t, () => document.querySelectorAll('.hot').forEach(n => n.classList.remove('hot')), true));

function makeChip(label, value, board, extraCls){
  const c = el('div', 'chip' + (extraCls ? ' ' + extraCls : ''), label);
  c.setAttribute('role', 'button'); c.tabIndex = 0; c.draggable = true; c.dataset.value = value; c.dataset.board = board;
  c.addEventListener('dragstart', e => { clearSel(); c.classList.add('dragging');
    e.dataTransfer.setData('text/plain', board); e.dataTransfer.effectAllowed = 'move'; window.__drag = c; });
  c.addEventListener('dragend', () => { c.classList.remove('dragging'); window.__drag = null; });
  c.addEventListener('click', e => { e.stopPropagation();
    if (selected && selected.chip === c){ clearSel(); return; }
    clearSel(); selected = { chip: c, board }; c.classList.add('sel'); });
  c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); c.click(); } });
  return c;
}
function makeTarget(node, board, accepts, onDrop){
  node.classList.add('target');
  node.addEventListener('dragover', e => { const c = window.__drag; if (!c || c.dataset.board !== board || !accepts(c)) return;
    e.preventDefault(); node.classList.add('hot'); });
  node.addEventListener('dragleave', () => node.classList.remove('hot'));
  node.addEventListener('drop', e => { e.preventDefault(); node.classList.remove('hot'); const c = window.__drag;
    if (c && c.dataset.board === board && accepts(c)){ e.stopPropagation(); window.__drag = null; onDrop(c); } });
  node.addEventListener('click', e => { if (selected && selected.board === board && accepts(selected.chip)){
    e.stopPropagation(); const c = selected.chip; clearSel(); onDrop(c); } });
}
function bounce(c){ c.classList.remove('sel'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }

/* slots: three tries, a closed slot hides its answer, a given slot is a head start and does not score */
function slotLogic(opts){
  const MAX = opts.max || 3;
  const findChip = pred => { for (const t of opts.trays){ const ch = [...t.querySelectorAll('.chip')].find(pred); if (ch) return ch; } return null; };
  opts.slots.forEach(s => { s.tries = 0; s.pts = 0; s.state = 'open';
    if (s.given){ s.state = 'given'; s.got = s.given;
      const ch = findChip(x => x.dataset.value === s.given); if (ch) ch.remove();
      if (s.answerSet) s.answerSet.delete(s.given); }
    s.render(s);
    if (!s.noTarget) makeTarget(s.node, opts.board, () => s.state === 'open', c => drop(s, c));
    (s.alt || []).forEach(n => makeTarget(n, opts.board, () => s.state === 'open', c => drop(s, c))); });
  function drop(s, c){
    if (s.state !== 'open') return;
    const right = s.answerSet ? s.answerSet.has(c.dataset.value) : c.dataset.value === s.answer;
    if (right){ s.state = 'ok'; s.pts = 3 - s.tries; s.got = c.dataset.value; c.remove(); if (s.answerSet) s.answerSet.delete(s.got); }
    else { s.tries++; bounce(c);
      if (s.tries >= MAX){ s.state = 'closed';
        const ch = findChip(x => s.answerSet ? s.answerSet.has(x.dataset.value) : x.dataset.value === s.answer);
        if (ch){ if (s.answerSet) s.answerSet.delete(ch.dataset.value); ch.remove(); } } }
    s.render(s); if (opts.report) opts.report(); if (opts.after) opts.after();
  }
  return { slots: opts.slots, drop };
}
const live = slots => slots.filter(s => s.state !== 'given');
function tally(slots){ const L = live(slots);
  return { pts: L.reduce((a, s) => a + s.pts, 0), max: L.length * 3, ok: L.filter(s => s.state === 'ok').length,
    n: L.length, open: L.filter(s => s.state === 'open').length }; }

/* ===================== one tab ===================== */
function buildTab(T, panel){
  const $ = sel => panel.querySelector(sel.replace(/#([\w-]+)/g, '[data-id="$1"]'));
  const B = k => T.id + ':' + k;
  const SCORE = {}; let runSaved = false;
  let n = 1;
  const PAGES = T.sections.concat(['score']);

  const pageEls = {}, stepEls = {}, done = new Set(); let cur = 0, booted = false;
  PAGES.forEach((k, i) => { const s = shell(k); s.classList.add('page'); s.querySelector('.num').textContent = String(n++).padStart(2, '0');
    const bar = el('div', 'pagebar');
    const back = el('button', 'pg back', 'Back'); back.type = 'button'; back.onclick = () => go(i - 1); if (i === 0) back.style.visibility = 'hidden';
    const msg = el('span', 'pgmsg', '');
    const next = el('button', 'pg next', 'Next section'); next.type = 'button'; next.onclick = () => go(i + 1);
    if (i === PAGES.length - 1) next.style.visibility = 'hidden';
    bar.appendChild(back); const rs = s.querySelector('.restart'); if (rs) bar.appendChild(rs); bar.appendChild(msg); bar.appendChild(next); s.appendChild(bar);
    panel.appendChild(s); pageEls[k] = s;
    const st = el('button', 'step-pill'); st.type = 'button'; st.appendChild(el('span', 'sn', String(i + 1))); st.appendChild(el('span', 'sl', SHORT[k]));
    st.onclick = () => go(i); stepper.appendChild(st); stepEls[k] = st; });
  function go(i){ if (i < 0 || i >= PAGES.length) return; clearSel(); cur = i;
    PAGES.forEach((k, j) => { const on = j === i; pageEls[k].hidden = !on; stepEls[k].classList.toggle('cur', on); stepEls[k].setAttribute('aria-current', on ? 'step' : 'false'); });
    const pg = pageEls[PAGES[i]]; pg.classList.remove('enter'); void pg.offsetWidth; pg.classList.add('enter');
    const tb = document.querySelector('.tabbar'); if (tb && !panel.hidden && booted){ const top = tb.offsetTop; if (Math.abs(window.scrollY - top) > 4) window.scrollTo(0, top); } }
  function markDone(k, isDone){
    const bar = pageEls[k].querySelector('.pagebar'), msg = bar.querySelector('.pgmsg'), nx = bar.querySelector('.next');
    stepEls[k].classList.toggle('done', isDone); bar.classList.toggle('complete', isDone); msg.textContent = isDone ? 'Section complete' : '';
    nx.classList.toggle('pulse', isDone);
    if (isDone && PAGES[cur] === k && !panel.hidden && k !== 'cs' && k !== 'nv'){
      setTimeout(() => { if (PAGES[cur] === k && !panel.hidden) go(cur + 1); }, 1400); } }
  const LABELS = { cs: 'Conditions and sparks', photos: 'Photos', group: "Who's who", pres: 'Presidents', people: 'People and leaders', terms: 'Key terms', nv: 'Why nonviolence worked' };

  function setScore(key, t){ SCORE[key] = t; paint();
    const isDone = t.n > 0 && t.open === 0;
    if (isDone && !done.has(key)){ done.add(key); markDone(key, true); }
    else if (!isDone && done.has(key)){ done.delete(key); markDone(key, false); } }
  function paint(){
    const rows = $('#score-rows'); rows.innerHTML = '';
    let P = 0, M = 0, OK = 0, S = 0, OPEN = 0;
    T.sections.forEach(k => { const s = SCORE[k]; if (!s) return;
      P += s.pts; M += s.max; OK += s.ok; S += s.n; OPEN += s.open;
      const li = el('li'); li.appendChild(el('span', '', LABELS[k])); li.appendChild(el('span', '', s.pts + '/' + s.max)); rows.appendChild(li); });
    const t = el('li', 'total'); t.appendChild(el('span', '', 'Total')); t.appendChild(el('span', '', P + '/' + M)); rows.appendChild(t);
    const pct = S ? Math.round(OK / S * 100) : 0;
    $('#acc').textContent = pct + '%';
    $('#rule').textContent = 'First try 3 points, second 2, third 1, then the slot closes.'
      + (T.sections.includes('cs') ? ' A wrong chip in a word cloud costs a point.' : '')
      + (T.id === 'full' ? ' Answers filled in for you do not count.' : '')
      + ' Accuracy is how many of the ' + S + ' slots you got right in the end. The stamp goes by accuracy.';
    const st = $('#stamp');
    if (S && OPEN === 0){
      st.hidden = false; let txt, col;
      if (pct >= 90){ txt = 'Mission accomplished'; col = 'var(--ok)'; }
      else if (pct >= 75){ txt = 'Solid work'; col = 'var(--blue)'; }
      else if (pct >= 60){ txt = 'Back to the slides'; col = '#c07a2c'; }
      else { txt = 'Study and try again'; col = 'var(--bad)'; }
      st.textContent = txt; st.style.color = col;
      if (!runSaved){ runSaved = true; const r = loadRuns(T.runs); r.push({ p: P, m: M, pct, t: Date.now() }); saveRuns(T.runs, r); paintRuns(true); }
    } else st.hidden = true;
  }
  function paintRuns(fresh){ const r = loadRuns(T.runs), done = Math.min(3, r.length);
    const box = $('#checks'); box.innerHTML = '';

      c.setAttribute('aria-label', 'Run ' + (i + 1) + (i < done ? ', finished' : ', not finished yet'));
      c.innerHTML = '<svg viewBox="0 0 48 48" fill="none" stroke="#3d9a3d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 25l10 10 20-22"/></svg>';
      c.appendChild(el('span', '', 'Run ' + (i + 1))); box.appendChild(c); }
    const tb = document.getElementById('tab-' + T.id);

    if (r.length){ const l = r[r.length - 1], d = new Date(l.t);

    else $('#runs-last').textContent = 'Most recent score: nothing yet'; }

  /* ----- big questions ----- */
  (function(){
    const box = $('#cards'); if (!box) return; if (T.bq.length === 4) box.classList.add('four');
    T.bq.forEach((k, i) => { const bq = BQ[k];
      const c = el('div', 'card'); c.setAttribute('role', 'button'); c.tabIndex = 0;
      c.setAttribute('aria-label', 'Big Question ' + (i + 1) + '. Press to flip.');
      const inner = el('div', 'inner');
      const f = el('div', 'face front'); f.appendChild(el('div', 'q-tag', 'Big Question ' + (i + 1))); f.appendChild(el('div', 'q-text', bq.q)); f.appendChild(el('div', 'flip-hint', 'Click to flip'));
      const b = el('div', 'face back'); b.appendChild(el('div', 'q-tag', bq.open ? 'Yours to answer' : 'From the slides')); b.appendChild(el('div', 'a-text', bq.open ? OPEN_ANSWER : bq.a)); b.appendChild(el('div', 'flip-hint', 'Click to flip back'));
      inner.appendChild(f); inner.appendChild(b); c.appendChild(inner);
      const flip = () => c.classList.toggle('flipped');
      c.addEventListener('click', flip);
      c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flip(); } });
      box.appendChild(c); });
  })();

  /* ----- conditions and sparks ----- */
  function buildCS(){
    const k = 'cs', C = T.cs, which = shuffle(C.pick)[0], D = Object.assign({}, CS[which], { decoys: CS[which].decoys }); C.decoys = D.decoys;
    pageEls.cs.querySelector('h2').lastChild.textContent = D.title;
    const tray = $('#' + k + '-tray'), cloud = $('#' + k + '-cloud'), sparksBox = $('#' + k + '-sparks'), note = $('#' + k + '-note'), ph = $('#' + k + '-ph');
    tray.innerHTML = ''; sparksBox.innerHTML = ''; note.hidden = true; note.textContent = D.note; ph.hidden = false;
    cloud.querySelectorAll('.word').forEach(w => w.remove());
    const old = cloud.parentNode.querySelector('.gone'); if (old) old.remove();
    const nC = D.conditions.length, nS = D.sparks.length;
    $('#' + k + '-lead').innerHTML = (C.givenConditions ? 'Some are filled in. ' : '')
      + D.lead + 'Conditions go in the cloud, sparks in the slots. Two chips belong nowhere.';
    const conds = D.conditions.map((c, i) => ({ label: c[0], size: c[1], x: c[2], y: c[3], rot: c[4], color: c[5], rank: i, placed: false, given: false }));
    shuffle(conds).slice(0, C.givenConditions).forEach(o => o.given = true);
    const condBy = new Map(conds.map(o => [o.label, o]));
    let misses = 0, missed = [];
    const place = o => { o.placed = true; ph.hidden = true;
      const w = el('div', 'word' + (o.given ? ' given' : ''), o.label);
      w.style.left = o.x + '%'; w.style.top = o.y + '%'; w.style.fontSize = 'calc(' + o.size + 'cqw * var(--k, 1))'; w.style.color = o.color;
      w.style.fontWeight = o.rank < 3 ? 500 : 400; w.style.setProperty('--rot', o.rot + 'deg');
      w.style.setProperty('--m', Math.max(14, Math.round(o.size * 5.2)) + 'px'); cloud.appendChild(w); };
    conds.filter(o => o.given).forEach(place);
    shuffle(conds.filter(o => !o.given).map(o => o.label).concat(D.sparks.map(x => x[0]), C.decoys)).forEach(t => tray.appendChild(makeChip(t, t, B(k))));
    const sparkSet = new Set(D.sparks.map(x => x[0])), gS = shuffle(D.sparks.map(x => x[0])).slice(0, C.givenSparks);
    sparksBox.style.setProperty('--n', nS);
    const sparkSlots = D.sparks.map((_, i) => {
      const card = el('div', 'spark'); const head = el('div', 'spark-head'); head.innerHTML = SPARK; head.appendChild(el('span', 'when', 'Spark'));
      const slot = el('div', 'slot name-slot'); card.appendChild(head); card.appendChild(slot); sparksBox.appendChild(card);
      return { node: slot, alt: [card], answerSet: sparkSet, given: gS[i] || null, render(st){
        card.className = 'spark' + (st.state === 'ok' ? ' ok' : st.state === 'closed' ? ' closed' : st.state === 'given' ? ' given' : '');
        slot.className = 'slot name-slot' + (st.state === 'ok' ? ' ok' : st.state === 'closed' ? ' closed' : st.state === 'given' ? ' given' : ''); slot.innerHTML = '';
        if (st.state === 'ok'){ slot.appendChild(el('span', 'placed', st.got)); slot.appendChild(el('span', 'pts', '+' + st.pts)); }
        else if (st.state === 'given') slot.appendChild(el('span', 'given-txt', st.got));
        else if (st.state === 'closed') slot.appendChild(el('span', 'closedtxt', 'Closed'));
        else { slot.appendChild(el('span', 'ph', 'A spark')); slot.appendChild(triesDots(3, st.tries)); } } };
    });
    slotLogic({ board: B(k), trays: [tray], slots: sparkSlots, report, after: finish });
    if (!cloud.dataset.wired){ cloud.dataset.wired = '1'; makeTarget(cloud, B(k), () => true, c => cloud.__drop && cloud.__drop(c)); }
    cloud.__drop = c => {
      const o = condBy.get(c.dataset.value);
      if (o && !o.placed){ c.remove(); place(o); }
      else { misses++; missed.push(c.dataset.value); bounce(c);
        if (C.decoys.includes(c.dataset.value)) setTimeout(() => c.remove(), 350);
        let g = cloud.parentNode.querySelector('.gone'); if (!g){ g = el('p', 'gone'); cloud.after(g); }
        g.textContent = 'Not a condition, minus one point each: ' + missed.join(', ') + '.'; }
      report(); finish(); };
    function finish(){
      const done = conds.every(o => o.placed) && sparkSlots.every(s => s.state !== 'open');
      if (done){ note.hidden = false; tray.querySelectorAll('.chip').forEach(c => c.remove()); } }
    function report(){
      const L = conds.filter(o => !o.given), placed = L.filter(o => o.placed).length, sp = tally(sparkSlots);
      setScore(k, { pts: Math.max(0, placed * 3 - misses) + sp.pts, max: L.length * 3 + sp.max,
        ok: placed + sp.ok, n: L.length + sp.n, open: L.length - placed + sp.open }); }
    report();
  }

  /* ----- the movement in photos ----- */
  function buildPhotos(){

  /* ----- who's who (group photo with hot spots) ----- */
  function buildGroup(){

    board.querySelector('img').src = PORTRAITS[G.img] || '';

    pageEls.group.classList.toggle('withdeeds', !!G.deeds);
    const S = shuffle(G.spots).slice(0, Math.min(C.perLoad, G.spots.length)).sort((a, b) => a[1] - b[1]);
    const gIdx = new Set(G.fixedGiven ? S.map((x, i) => G.fixedGiven.includes(x[0]) ? i : -1).filter(i => i >= 0) : shuffle(S.map((x, i) => i)).slice(0, C.given));

        const d = Math.hypot(b.left + b.width / 2 - x, b.top + b.height / 2 - y); if (d < bd){ bd = d; best = s; } });

    const L = PRES.list, live = L.filter((p, i) => C.live.includes(i));
    $('#pres-lead').textContent = 'Drop each president\'s name and what they did. One name and one line belong to no one.';
    shuffle(live.map(p => p[0]).concat(C.distract ? [PRES.decoy[0]] : [])).forEach(n => tN.appendChild(makeChip(n, 'n:' + n, B('pres-n'))));
    shuffle(live.map(p => p[1]).concat(C.distract ? [PRES.decoy[1]] : [])).forEach(d => tD.appendChild(makeChip(d, 'd:' + d, B('pres-d'), 'deed')));
    const nameSlots = [], deedSlots = [];
    L.forEach((p, i) => {
      const col = el('div', 'prescol'); const ns = el('div', 'slot name-slot'), ds = el('div', 'slot deedslot'); col.appendChild(ns); col.appendChild(ds); cols.appendChild(col);
      if (!C.live.includes(i) && !C.given.includes(i)){ col.classList.add('later'); ns.appendChild(el('span', 'ph', 'Part 2')); return; }
      const render = (label, ph, isName) => st => { const nd = st.node;
        nd.className = 'slot' + (isName ? ' name-slot' : ' deedslot') + (st.state === 'ok' ? ' ok' : st.state === 'closed' ? ' closed' : st.state === 'given' ? ' given' : '');
        nd.innerHTML = '';
        if (st.state === 'ok'){ nd.appendChild(el('span', isName ? 'placed' : '', label)); nd.appendChild(el('span', 'pts', '+' + st.pts)); }
        else if (st.state === 'given') nd.appendChild(el('span', 'given-txt', label));
        else if (st.state === 'closed') nd.appendChild(el('span', 'closedtxt', 'Closed'));
        else { nd.appendChild(el('span', 'ph', ph)); nd.appendChild(triesDots(3, st.tries)); } };
      const g = C.given.includes(i);
      nameSlots.push({ node: ns, answer: 'n:' + p[0], given: g ? 'n:' + p[0] : null, render: render(p[0], 'Name', true) });
      deedSlots.push({ node: ds, answer: 'd:' + p[1], given: g ? 'd:' + p[1] : null, render: render(p[1], 'What they did', false) });
    });
    slotLogic({ board: B('pres-n'), trays: [tN], slots: nameSlots, report });
    slotLogic({ board: B('pres-d'), trays: [tD], slots: deedSlots, report });
    function report(){ setScore('pres', tally(nameSlots.concat(deedSlots))); }
    report();
  }

  /* ----- why was nonviolent protest effective (reason cloud) ----- */
  function buildNV(){
    const C = T.nv, tray = $('#nv-tray'), cloud = $('#nv-cloud'), note = $('#nv-note'), ph = $('#nv-ph');
    tray.innerHTML = ''; note.hidden = true; note.textContent = NV.note; ph.hidden = false; cloud.querySelectorAll('.word').forEach(w => w.remove());
    const old = cloud.parentNode.querySelector('.gone'); if (old) old.remove();
    const rs = NV.reasons.map((c, i) => ({ label: c[0], size: c[1], x: c[2], y: c[3], rot: c[4], color: c[5], rank: i, placed: false, given: false }));
    shuffle(rs).slice(0, C.given).forEach(o => o.given = true);
    $('#nv-lead').textContent = (C.given ? 'Some are filled in. ' : '') + 'They faced dogs, fire hoses, bombs and jail, and still won. Drag the reasons into the cloud. Two chips are not reasons.';
    const by = new Map(rs.map(o => [o.label, o])); let misses = 0; const missed = [];
    const place = o => { o.placed = true; ph.hidden = true;
      const w = el('div', 'word' + (o.given ? ' given' : ''), o.label);
      w.style.left = o.x + '%'; w.style.top = o.y + '%'; w.style.fontSize = 'calc(' + o.size + 'cqw * var(--k, 1))'; w.style.color = o.color;
      w.style.fontWeight = o.rank < 3 ? 500 : 400; w.style.setProperty('--rot', o.rot + 'deg');
      w.style.setProperty('--m', Math.max(14, Math.round(o.size * 5.2)) + 'px'); cloud.appendChild(w); };
    rs.filter(o => o.given).forEach(place);
    shuffle(rs.filter(o => !o.given).map(o => o.label).concat(NV.decoys)).forEach(t => tray.appendChild(makeChip(t, t, B('nv'))));
    if (!cloud.dataset.wired){ cloud.dataset.wired = '1'; makeTarget(cloud, B('nv'), () => true, c => cloud.__drop && cloud.__drop(c)); }
    cloud.__drop = c => { const o = by.get(c.dataset.value);
      if (o && !o.placed){ c.remove(); place(o); }
      else { misses++; missed.push(c.dataset.value); bounce(c); setTimeout(() => c.remove(), 350);
        let g = cloud.parentNode.querySelector('.gone'); if (!g){ g = el('p', 'gone'); cloud.after(g); }
        g.textContent = 'Not a reason, minus one point each: ' + missed.join(', ') + '.'; }
      if (rs.every(x => x.placed)){ note.hidden = false; tray.querySelectorAll('.chip').forEach(x => x.remove()); }
      report(); };
    function report(){ const L = rs.filter(x => !x.given), placed = L.filter(x => x.placed).length;
      setScore('nv', { pts: Math.max(0, placed * 3 - misses), max: L.length * 3, ok: placed, n: L.length, open: L.length - placed }); }
    report();
  }

  /* ----- people ----- */
  function buildPeople(){
    const C = T.people, box = $('#leaders'), tN = $('#lead-names'), tD = $('#lead-deeds');
    box.innerHTML = ''; tN.innerHTML = ''; tD.innerHTML = '';
    const pool = LEADERS.filter(l => l[4].some(h => C.halves.includes(h))).map(l => ({ name: l[0], deed: (C.early && l[3]) || l[1], key: l[2] }));
    const order = shuffle(pool);
    (C.must || []).forEach(k => { const i = order.findIndex(p => p.key === k); if (i >= C.perLoad){ const [m] = order.splice(i, 1); order.splice(Math.floor(Math.random() * C.perLoad), 0, m); } });
    const on = order.slice(0, C.perLoad), rest = order.slice(C.perLoad);
    const hs = C.headStart ? () => C.headStart[0] + Math.floor(Math.random() * (C.headStart[1] - C.headStart[0] + 1)) : () => 0;
    const faces = shuffle(on.map(p => p.key)), nG = hs(), dG = hs();
    const givenN = new Set(faces.slice(0, nG)), givenD = new Set(faces.slice(nG, nG + dG));
    $('#lead-lead').textContent = 'Two slots per face: the name and what they did. Two names and two lines belong to no one.';
    $('#lead-meta').textContent = cap1(word(C.perLoad)) + ' faces, ' + word(C.perLoad * 2 - givenN.size - givenD.size) + ' slots to fill';
    const offN = shuffle(rest).slice(0, C.distract), offD = shuffle(rest).slice(0, C.distract);
    shuffle(on.concat(offN)).forEach(p => tN.appendChild(makeChip(p.name, 'n:' + p.key, B('lead-n'))));
    shuffle(on.concat(offD)).forEach(p => tD.appendChild(makeChip(p.deed, 'd:' + p.key, B('lead-d'), 'deed')));
    const nameSlots = [], deedSlots = [];
    on.forEach(p => {
      const card = el('div', 'leader'), ov = el('div', 'oval'), img = el('img');
      img.src = PORTRAITS[p.key] || ''; img.alt = 'Portrait of a person from the Civil Rights era'; ov.appendChild(img); card.appendChild(ov);
      const ns = el('div', 'slot name-slot'), ds = el('div', 'slot'); card.appendChild(ns); card.appendChild(ds); box.appendChild(card);
      const render = (label, ph, isName) => st => { const nd = st.node;
        nd.className = 'slot' + (isName ? ' name-slot' : '') + (st.state === 'ok' ? ' ok' : st.state === 'closed' ? ' closed' : st.state === 'given' ? ' given' : '');
        nd.innerHTML = '';
        if (st.state === 'ok'){ nd.appendChild(el('span', isName ? 'placed' : '', label)); nd.appendChild(el('span', 'pts', '+' + st.pts)); }
        else if (st.state === 'given') nd.appendChild(el('span', 'given-txt', label));
        else if (st.state === 'closed') nd.appendChild(el('span', 'closedtxt', 'Closed'));
        else { nd.appendChild(el('span', 'ph', ph)); nd.appendChild(triesDots(3, st.tries)); } };
      nameSlots.push({ node: ns, answer: 'n:' + p.key, given: givenN.has(p.key) ? 'n:' + p.key : null, alt: [card], render: render(p.name, 'Name', true) });
      deedSlots.push({ node: ds, answer: 'd:' + p.key, given: givenD.has(p.key) ? 'd:' + p.key : null, alt: [card], render: render(p.deed, 'What they did', false) });
    });
    slotLogic({ board: B('lead-n'), trays: [tN], slots: nameSlots, report });
    slotLogic({ board: B('lead-d'), trays: [tD], slots: deedSlots, report });
    function report(){ setScore('people', tally(nameSlots.concat(deedSlots))); }
    report();
  }

  /* ----- category matching (protests, attacks, laws, vocab) ----- */
  function buildTerms(){
    const C = T.terms, tray = $('#terms-tray'), defs = $('#terms-defs'), nextBtn = $('#next-round'), lab = $('#round-label');
    const order = ['protests', 'attacks', 'laws', 'vocab'];
    const rounds = order.map(k => { const D = CATS[k], items = D.items;
      let pick = items.filter(v => k === 'vocab' && (C.must || []).includes(v[0]));
      if (C.halves.length === 1){ pick = pick.concat(shuffle(items.filter(v => v[2] === C.halves[0] && !pick.includes(v))).slice(0, Math.max(0, C.size - pick.length))); }
      else { const per = Math.floor(C.size / C.halves.length); C.halves.forEach(h => { pick = pick.concat(shuffle(items.filter(v => v[2] === h && !pick.includes(v))).slice(0, per)); }); }
      const spare = shuffle(items.filter(v => !pick.includes(v) && C.halves.includes(v[2]))).concat(shuffle(items.filter(v => !C.halves.includes(v[2]))));
      return { k, title: D.title, pick: shuffle(pick), dist: spare.slice(0, C.distract) }; });
    const total = rounds.reduce((a, r) => a + r.pick.length, 0);
    $('#terms-lead').textContent = 'Four quick rounds. Drag each name onto what it matches. Extra names match nothing.';
    const results = []; rounds.forEach(r => r.pick.forEach(() => results.push({ state: 'open', pts: 0 })));
    let r = 0;
    nextBtn.onclick = () => { if (r < rounds.length - 1){ r++; show(); } };
    function show(){
      tray.innerHTML = ''; defs.innerHTML = ''; nextBtn.hidden = true;
      const R = rounds[r], base = rounds.slice(0, r).reduce((a, x) => a + x.pick.length, 0);
      lab.textContent = 'Round ' + (r + 1) + ' of ' + rounds.length + ': ' + R.title;
      shuffle(R.pick.concat(R.dist)).forEach(t => tray.appendChild(makeChip(t[0], t[0], B('terms'))));
      const slots = R.pick.map((t, j) => {
        const row = el('div', 'def'), sl = el('div', 'slot name-slot'); row.appendChild(sl); row.appendChild(el('p', '', t[1])); defs.appendChild(row);
        return { node: sl, answer: t[0], alt: [row], render(st){
          sl.className = 'slot name-slot' + (st.state === 'ok' ? ' ok' : st.state === 'closed' ? ' closed' : ''); sl.innerHTML = '';
          if (st.state === 'ok'){ sl.appendChild(el('span', 'placed', t[0])); sl.appendChild(el('span', 'pts', '+' + st.pts)); }
          else if (st.state === 'closed') sl.appendChild(el('span', 'closedtxt', 'Closed'));
          else { sl.appendChild(el('span', 'ph', 'Drop a name')); sl.appendChild(triesDots(3, st.tries)); }
          results[base + j] = { state: st.state, pts: st.pts }; } };
      });
      slotLogic({ board: B('terms'), trays: [tray], slots, report, after(){
        if (slots.every(s => s.state !== 'open')){
          if (r < rounds.length - 1) nextBtn.hidden = false;
          else { tray.innerHTML = ''; tray.appendChild(el('span', 'done', 'All rounds finished')); } } } });
    }
    function report(){ setScore('terms', tally(results)); }
    show(); report();
  }

  const BUILDERS = { cs: buildCS, photos: buildPhotos, group: buildGroup, pres: buildPres, people: buildPeople, terms: buildTerms, nv: buildNV };
  T.sections.forEach(k => BUILDERS[k]());
  panel.querySelectorAll('[data-restart]').forEach(b => b.addEventListener('click', () => { clearSel(); BUILDERS[b.dataset.restart](); }));
  paintRuns(); go(0); booted = true;
}

/* ===================== tabs ===================== */
(function(){
  const bar = document.getElementById('tabs'), panels = document.getElementById('panels'), sub = document.getElementById('mast-sub');
  const btns = {};
  TABS.forEach(T => {
    const b = el('button', 'tab'); b.type = 'button'; b.setAttribute('role', 'tab'); b.id = 'tab-' + T.id;
    b.setAttribute('aria-controls', 'panel-' + T.id); b.appendChild(document.createTextNode(T.tab)); b.appendChild(el('small', '', T.hint));
    bar.appendChild(b); btns[T.id] = b;
    const p = el('div', 'tabpanel'); p.id = 'panel-' + T.id; p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', b.id);
    panels.appendChild(p); buildTab(T, p);
    b.addEventListener('click', () => show(T.id, true));
  });
  bar.addEventListener('keydown', e => { if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const ids = TABS.map(t => t.id), i = ids.indexOf(document.activeElement.id.replace('tab-', ''));
    if (i < 0) return; const nx = ids[(i + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length]; show(nx, true); btns[nx].focus(); });
  function show(id, user){
    clearSel();
    TABS.forEach(T => { const on = T.id === id; btns[T.id].setAttribute('aria-selected', on); btns[T.id].tabIndex = on ? 0 : -1;
      document.getElementById('panel-' + T.id).hidden = !on; if (on) sub.textContent = T.sub; });
    if (user){ try { history.replaceState(null, '', '#' + id); } catch(e){} try { localStorage.setItem('crc-tab', id); } catch(e){}
      const top = document.querySelector('.tabbar').offsetTop; if (window.scrollY > top) window.scrollTo(0, top); }
  }
  let start = (location.hash || '').slice(1);
  if (!TABS.some(t => t.id === start)){ try { start = localStorage.getItem('crc-tab'); } catch(e){ start = null; } }
  if (!TABS.some(t => t.id === start)) start = TABS[0].id;
  show(start, false);
})();
</script>
